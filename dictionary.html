
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1a1a2e" />
<title>查词 · Daily English</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html.embed-mode body { padding: 10px; background: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    background-attachment: fixed;
    min-height: 100vh; color: #e8e8e8; padding: 20px;
  }
  .app { max-width: 780px; margin: 0 auto; }

  .header {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 20px 24px; margin-bottom: 16px;
    backdrop-filter: blur(10px);
  }
  .header h1 {
    font-size: 22px; font-weight: 800;
    background: linear-gradient(135deg, #00e5ff, #d500f9);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header .subtitle { font-size: 12px; color: #8a8fa3; margin-top: 4px; }

  /* Tabs */
  .dict-tabs {
    display: flex; gap: 6px; margin-bottom: 14px;
    background: rgba(255,255,255,0.03); padding: 5px;
    border-radius: 12px; border: 1px solid rgba(255,255,255,0.08);
  }
  .dict-tab {
    flex: 1; padding: 10px; text-align: center;
    background: transparent; border: none; color: #8a8fa3;
    font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; border-radius: 8px; transition: all .15s;
  }
  .dict-tab:hover { color: #d8dce8; background: rgba(255,255,255,0.04); }
  .dict-tab.active {
    background: rgba(0,229,255,0.15); color: #00e5ff;
    box-shadow: 0 0 0 1px rgba(0,229,255,0.3);
  }
  .dict-tab .wb-badge {
    display: inline-block; min-width: 18px; padding: 0 6px; height: 16px;
    line-height: 16px; font-size: 10px; font-weight: 800; margin-left: 4px;
    background: rgba(243,156,18,0.25); color: #f39c12; border-radius: 8px;
  }

  /* 搜索栏 */
  .search-bar { display: flex; gap: 10px; margin-bottom: 14px; }
  .input-wrap { position: relative; flex: 1; min-width: 0; }
  #searchInput {
    width: 100%; padding: 14px 52px 14px 18px; font-size: 17px; font-family: inherit;
    background: rgba(0,0,0,0.3); color: #fff;
    border: 2px solid rgba(255,255,255,0.12); border-radius: 12px;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  #searchInput:focus { border-color: #00e5ff; box-shadow: 0 0 0 4px rgba(0,229,255,0.15); }
  /* X 按钮：始终显示，输入时变亮可点 */
  .clear-btn {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(255,255,255,0.08); border: none;
    color: rgba(255,255,255,0.6); font-size: 19px; line-height: 1; cursor: pointer;
    font-family: inherit; padding: 0; display: flex; align-items: center; justify-content: center;
    transition: all .15s; opacity: 0.35; pointer-events: none;
  }
  .clear-btn.show { opacity: 1; pointer-events: auto; background: rgba(255,255,255,0.12); color: #fff; }
  .clear-btn:hover { background: rgba(255,107,107,0.3); color: #ff6b6b; transform: translateY(-50%) scale(1.1); }

  #searchBtn {
    padding: 0 26px; font-size: 15px; font-weight: 700; font-family: inherit;
    background: linear-gradient(135deg, #00e5ff, #00b8d9); color: #0a1929;
    border: none; border-radius: 12px; cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,229,255,0.3); transition: all .15s; white-space: nowrap;
  }
  #searchBtn:hover { box-shadow: 0 6px 22px rgba(0,229,255,0.45); transform: translateY(-1px); }
  #searchBtn:disabled { opacity: 0.5; cursor: wait; }

  /* 历史 / 快捷词 */
  .chips-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: center; }
  .chips-label { font-size: 12px; color: #6a7090; margin-right: 4px; }
  .chip-link {
    padding: 5px 12px; font-size: 12.5px; border-radius: 14px;
    background: rgba(0,229,255,0.08); color: #00e5ff;
    border: 1px solid rgba(0,229,255,0.25); cursor: pointer; transition: all .15s; user-select: none;
  }
  .chip-link:hover { background: rgba(0,229,255,0.18); transform: translateY(-1px); }
  .chip-clear { color: #ff6b6b; border-color: rgba(255,107,107,0.3); background: rgba(255,107,107,0.08); }
  .chip-clear:hover { background: rgba(255,107,107,0.18); }

  /* 结果卡片 */
  .result-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px; padding: 22px 24px; margin-bottom: 16px;
    backdrop-filter: blur(10px); animation: fadeUp .25s ease;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .word-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .word-title { font-size: 30px; font-weight: 800; color: #fff; }
  .word-phonetic { font-size: 14px; color: #8a8fa3; font-family: "SF Mono", Monaco, monospace; }
  .word-source {
    font-size: 10.5px; padding: 2px 8px; border-radius: 8px;
    background: rgba(0,229,255,0.12); color: #00e5ff;
    border: 1px solid rgba(0,229,255,0.25); margin-left: auto;
  }
  .word-source.offline { background: rgba(142,68,173,0.15); color: #bb8fce; border-color: rgba(142,68,173,0.35); }
  .word-source.cached  { background: rgba(80,227,194,0.12); color: #50e3c2; border-color: rgba(80,227,194,0.3); }
  .word-source.cn      { background: rgba(243,156,18,0.15); color: #f39c12; border-color: rgba(243,156,18,0.35); }

  .speak-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(0,229,255,0.12); border: 1px solid rgba(0,229,255,0.35);
    color: #00e5ff; cursor: pointer; font-size: 15px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all .15s; padding: 0;
  }
  .speak-btn:hover { background: rgba(0,229,255,0.25); transform: scale(1.05); }
  .speak-btn.playing { background: rgba(0,229,255,0.4); }

  .wb-add-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(243,156,18,0.12); border: 1px solid rgba(243,156,18,0.4);
    color: #f39c12; cursor: pointer; font-size: 16px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: all .15s; padding: 0;
  }
  .wb-add-btn:hover { background: rgba(243,156,18,0.25); transform: scale(1.05); }
  .wb-add-btn.added {
    background: rgba(39,174,96,0.18); border-color: rgba(39,174,96,0.5); color: #2ecc71;
  }
  .wb-add-btn.added:hover { background: rgba(255,107,107,0.2); border-color: rgba(255,107,107,0.5); color: #ff6b6b; }

  .cn-meaning {
    font-size: 15px; color: #50e3c2; padding: 10px 14px;
    background: rgba(80,227,194,0.06); border-left: 3px solid #50e3c2;
    border-radius: 0 8px 8px 0; margin-bottom: 16px; line-height: 1.6;
  }
  .cn-meaning .cn-label {
    font-size: 10.5px; font-weight: 700; color: #50e3c2; opacity: 0.7;
    display: block; margin-bottom: 4px; letter-spacing: 0.5px;
  }

  .vocab-jump-row { margin: 12px 0 4px; }
  .vocab-jump-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 20px; font-size: 14px; font-weight: 700; font-family: inherit;
    background: linear-gradient(135deg, rgba(0,229,255,0.15), rgba(213,0,249,0.15));
    color: #00e5ff; border: 1px solid rgba(0,229,255,0.4);
    border-radius: 12px; cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .vocab-jump-btn:hover {
    background: linear-gradient(135deg, rgba(0,229,255,0.25), rgba(213,0,249,0.25));
    transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,229,255,0.25);
  }

  .meanings-title {
    font-size: 12px; color: #8a8fa3; margin: 16px 0 10px;
    text-transform: uppercase; letter-spacing: 1px; font-weight: 700;
  }
  .meaning-group {
    background: rgba(0,0,0,0.2); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .pos {
    display: inline-block; font-size: 11.5px; font-weight: 700;
    color: #f39c12; background: rgba(243,156,18,0.12);
    padding: 2px 10px; border-radius: 10px; margin-bottom: 8px;
  }
  .def-item { margin-bottom: 10px; }
  .def-item:last-child { margin-bottom: 0; }
  .def-text { font-size: 14px; color: #d8dce8; line-height: 1.6; }
  .def-example {
    font-size: 13px; color: #8a8fa3; font-style: italic;
    margin-top: 4px; padding-left: 14px;
    border-left: 2px solid rgba(0,229,255,0.2);
  }
  .synonyms { margin-top: 8px; font-size: 12px; color: #8a8fa3; }
  .synonyms .syn-tag {
    display: inline-block; padding: 1px 8px; margin: 2px;
    background: rgba(0,229,255,0.08); color: #00e5ff;
    border-radius: 8px; cursor: pointer;
  }
  .synonyms .syn-tag:hover { background: rgba(0,229,255,0.2); }

  .status-msg {
    text-align: center; padding: 30px 20px; color: #6a7090;
    font-size: 13px; line-height: 1.7;
  }
  .status-msg .icon { font-size: 44px; margin-bottom: 10px; opacity: 0.6; }

  /* ========== 生词表 ========== */
  .wb-toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .wb-tool-btn {
    padding: 9px 16px; font-size: 13px; font-weight: 600;
    font-family: inherit; border-radius: 10px; cursor: pointer;
    background: rgba(255,255,255,0.06); color: #d8dce8;
    border: 1px solid rgba(255,255,255,0.12); transition: all .15s;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .wb-tool-btn:hover { background: rgba(0,229,255,0.12); color: #00e5ff; border-color: rgba(0,229,255,0.35); }
  .wb-tool-btn.danger { color: #ff6b6b; border-color: rgba(255,107,107,0.3); }
  .wb-tool-btn.danger:hover { background: rgba(255,107,107,0.15); }
  .wb-tool-btn input[type="file"] { display: none; }

  .wb-search {
    width: 100%; padding: 10px 14px; margin-bottom: 12px;
    background: rgba(0,0,0,0.25); color: #fff; font-family: inherit;
    border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
    font-size: 14px; outline: none; transition: border-color .15s;
  }
  .wb-search:focus { border-color: rgba(0,229,255,0.5); }

  .wb-list { display: flex; flex-direction: column; gap: 8px; }
  .wb-item {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 12px 14px;
    display: flex; align-items: flex-start; gap: 10px;
    transition: all .15s;
  }
  .wb-item:hover { border-color: rgba(0,229,255,0.3); background: rgba(0,229,255,0.04); }
  .wb-item-info { flex: 1; min-width: 0; }
  .wb-item-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .wb-item-word { font-size: 17px; font-weight: 800; color: #fff; }
  .wb-item-phonetic { font-size: 12px; color: #8a8fa3; font-family: "SF Mono", Monaco, monospace; }
  .wb-item-cn { font-size: 13px; color: #50e3c2; margin-top: 3px; line-height: 1.5; }
  .wb-item-date { font-size: 11px; color: #6a7090; margin-top: 5px; }
  .wb-item-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .wb-item-btn {
    width: 30px; height: 30px; border-radius: 8px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: #8a8fa3; cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s; padding: 0; font-family: inherit;
  }
  .wb-item-btn:hover { background: rgba(0,229,255,0.15); color: #00e5ff; border-color: rgba(0,229,255,0.35); }
  .wb-item-btn.danger:hover { background: rgba(255,107,107,0.18); color: #ff6b6b; border-color: rgba(255,107,107,0.4); }

  .wb-empty {
    text-align: center; padding: 40px 20px; color: #6a7090;
    font-size: 13px; line-height: 1.7;
  }
  .wb-empty .icon { font-size: 44px; margin-bottom: 12px; opacity: 0.5; }

  /* 中文查询结果条目 */
  .cn-match-item {
    background: rgba(243,156,18,0.05);
    border: 1px solid rgba(243,156,18,0.25);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
    cursor: pointer; transition: all .15s;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .cn-match-item:hover {
    background: rgba(243,156,18,0.12);
    border-color: rgba(243,156,18,0.5);
    transform: translateY(-1px);
  }
  .cn-match-info { flex: 1; min-width: 0; }
  .cn-match-word { font-size: 17px; font-weight: 800; color: #fff; }
  .cn-match-phonetic { font-size: 12px; color: #8a8fa3; font-family: "SF Mono", Monaco, monospace; margin-left: 6px; }
  .cn-match-meaning { font-size: 13px; color: #f39c12; margin-top: 3px; }

  /* Toast */
  .dict-toast {
    position: fixed; left: 50%; bottom: 40px; transform: translate(-50%, 20px);
    padding: 10px 20px; background: rgba(0,229,255,0.95); color: #0a1929;
    border-radius: 10px; font-size: 13px; font-weight: 700;
    box-shadow: 0 4px 20px rgba(0,229,255,0.4);
    opacity: 0; transition: all .25s ease; z-index: 99999;
    pointer-events: none; max-width: 80vw; text-align: center;
  }
  .dict-toast.show { opacity: 1; transform: translate(-50%, 0); }
  .dict-toast[data-type="danger"] { background: rgba(255,107,107,0.95); color: #fff; }

  @media (max-width: 480px) {
    body { padding: 12px; }
    .header, .result-card { padding: 16px 18px; }
    .word-title { font-size: 24px; }
    #searchInput { font-size: 16px; padding: 12px 46px 12px 14px; }
    #searchBtn { padding: 0 18px; font-size: 14px; }
    .dict-tab { font-size: 13px; padding: 9px 6px; }
  }
</style>
</head>
<body data-app="dict">

<div class="app">
  <div class="header" id="pageHeader">
    <h1>📖 查词</h1>
    <div class="subtitle">离线词典 + 联网释义 + 中文简译 + 生词表 · 支持中英互查</div>
  </div>

  <div class="dict-tabs" id="dictTabs">
    <button class="dict-tab active" data-tab="dict">📖 查词</button>
    <button class="dict-tab" data-tab="wordbook">⭐ 生词表<span class="wb-badge" id="wbTabBadge" style="display:none;">0</span></button>
  </div>

  <div id="paneDict">
    <div class="search-bar">
      <div class="input-wrap">
        <input id="searchInput" type="text" placeholder="输入英文或中文，如 declare / 宣布"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
        <button id="clearBtn" class="clear-btn" title="清空" aria-label="清空输入">×</button>
      </div>
      <button id="searchBtn">查询</button>
    </div>

    <div class="chips-row" id="historyRow"></div>
    <div class="chips-row" id="quickRow"></div>

    <div id="resultArea"></div>
  </div>

  <div id="paneWordbook" style="display:none;">
    <div class="wb-toolbar">
      <button class="wb-tool-btn" id="wbExportBtn">💾 导出 JSON</button>
      <button class="wb-tool-btn" id="wbImportBtn">
        📂 导入 JSON
        <input type="file" id="wbImportFile" accept="application/json,.json" />
      </button>
      <button class="wb-tool-btn danger" id="wbClearBtn">🗑 清空</button>
    </div>
    <input class="wb-search" id="wbSearchInput" type="text" placeholder="搜索生词..." />
    <div class="wb-list" id="wbList"></div>
  </div>
</div>

<script>
/* ============================================================
 *  1. 离线词典（★ 保持你原有的 OFFLINE_DICT 完整内容不变）
 * ============================================================ */
const OFFLINE_DICT = {
  /* ...此处保留你当前 dictionary.html 中所有词条，不重复贴出... */
  "declare":["/dɪˈkler/","v. 宣布，声明"],
  "obtain":["/əbˈteɪn/","v. 获得，取得"],
  "essential":["/ɪˈsenʃl/","adj. 本质的，必需的"],
  "crucial":["/ˈkruːʃl/","adj. 关键的，决定性的"],
  "hello":["/həˈloʊ/","int. 你好"],
  "world":["/wɜːrld/","n. 世界"],
  "work":["/wɜːrk/","n. 工作，事务"],
  "study":["/ˈstʌdi/","v. 研究，学习"],
  "understand":["/ˌʌndərˈstænd/","v. 理解"],
  "remember":["/rɪˈmembər/","v. 记得"],
  "important":["/ɪmˈpɔːrtnt/","adj. 重要的"],
  "beautiful":["/ˈbjuːtɪfl/","adj. 美丽的"],
  "happy":["/ˈhæpi/","adj. 高兴的"],
  "generate":["/ˈdʒenəreɪt/","v. 生成，引起"],
  "concoct":["/kənˈkɒkt/","v. 编造，捏造"],
  "ponder":["/ˈpɑːndər/","v. 沉思，考虑"],
  "contemplate":["/ˈkɑːntəmpleɪt/","v. 凝视，深思"],
  "reflect":["/rɪˈflekt/","v. 反思，反省"],
  "deliberate":["/dɪˈlɪbəreɪt/","v. 仔细考虑，权衡"],
  "speculate":["/ˈspekjuleɪt/","v. 推测，猜测"],
  "grasp":["/ɡræsp/","v. 理解，掌握"],
  "realize":["/ˈriːəlaɪz/","v. 意识到，领悟"],
  "comprehend":["/ˌkɒmprɪˈhend/","v. 精确理解"],
  "notice":["/ˈnoʊtɪs/","v. 注意到，察觉"],
  "observe":["/əbˈzɜːrv/","v. 观察，留意"],
  "perceive":["/pərˈsiːv/","v. 感知，察觉"],
  "detect":["/dɪˈtɛkt/","v. 检测，发现"],
  "gaze":["/ɡeɪz/","v. 凝视"],
  "monitor":["/ˈmɒnɪtə/","v. 监控"],
  "scrutinize":["/ˈskruːtənaɪz/","v. 仔细审查"],
  "excellent":["/ˈeksələnt/","adj. 出色的，卓越的"],
  "superb":["/suːˈpɜːrb/","adj. 极好的，一流的"],
  "outstanding":["/aʊtˈstændɪŋ/","adj. 杰出的，出众的"],
  "remarkable":["/rɪˈmɑːrkəbl/","adj. 非凡的，显著的"],
  "splendid":["/ˈsplendɪd/","adj. 辉煌的，极好的"],
  "enormous":["/ɪˈnɔːrməs/","adj. 巨大的，庞大的"],
  "massive":["/ˈmæsɪv/","adj. 大量的，巨大的"],
  "immense":["/ɪˈmens/","adj. 无边的，巨大的"],
  "colossal":["/kəˈlɑːsl/","adj. 巨大的，庞大的"],
  "gigantic":["/dʒaɪˈɡæntɪk/","adj. 巨大的，巨人般的"],
  "crucial":["/ˈkruːʃl/","adj. 关键的，决定性的"],
  "vital":["/ˈvaɪtl/","adj. 必不可少的，至关重要的"],
  "significant":["/sɪɡˈnɪfɪkənt/","adj. 重要的，意义重大的"],
  "essential":["/ɪˈsenʃl/","adj. 本质的，必需的"],
  "paramount":["/ˈpærəmaʊnt/","adj. 至高无上的，首要的"],
  "state":["/steɪt/","v. 陈述，声明"],
  "express":["/ɪkˈspres/","v. 表达"],
  "articulate":["/ɑːrˈtɪkjəleɪt/","v. 清晰表达"],
  "assert":["/əˈsɜːrt/","v. 断言，主张"],
  "maintain":["/meɪnˈteɪn/","v. 维持，保养"],
  "preserve":["/prɪˈzɜːrv/","v. 保存，保护"],
  "sustain":["/səˈsteɪn/","v. 维持，支撑"],
  "perpetuate":["/pərˈpetʃueɪt/","v. 使延续，助长"],
  "allow":["/əˈlaʊ/","v. 允许"],
  "permit":["/ˈpɜːrmɪt/","v. 允许（正式）"],
  "enable":["/ɪˈneɪbl/","v. 使能够"],

 *  3. 缓存 & 历史
 * ============================================================ */
const CACHE_KEY = "dict_cache_v1";
const HISTORY_KEY = "dict_history_v1";
const MAX_HISTORY = 12;

function loadCache() { try { return JSON.parse(localStorage.getItem(CACHE_KEY) || "{}"); } catch (e) { return {}; } }
function saveCache(c) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(c)); } catch (e) {} }
function loadHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); } catch (e) { return []; } }
function pushHistory(word) {
  let h = loadHistory().filter(w => w !== word);
  h.unshift(word);
  if (h.length > MAX_HISTORY) h = h.slice(0, MAX_HISTORY);
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); } catch (e) {}
  renderHistory();
}
function clearHistory() { try { localStorage.removeItem(HISTORY_KEY); } catch (e) {} renderHistory(); }

/* ============================================================
 *  4. IndexedDB 生词表
 * ============================================================ */
const DB_NAME = "dict_wordbook_v1";
const DB_STORE = "words";
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(DB_STORE)) {
        const os = db.createObjectStore(DB_STORE, { keyPath: "word" });
        os.createIndex("addedAt", "addedAt");
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function wbAdd(item) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).put(item);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function wbDelete(word) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).delete(word);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function wbGetAll() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, "readonly");
    const req = tx.objectStore(DB_STORE).getAll();
    req.onsuccess = () => {
      const list = req.result || [];
      list.sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));
      resolve(list);
    };
    req.onerror = () => reject(req.error);
  });
}
async function wbHas(word) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, "readonly");
    const req = tx.objectStore(DB_STORE).get(word);
    req.onsuccess = () => resolve(!!req.result);
    req.onerror = () => reject(req.error);
  });
}
async function wbClear() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, "readwrite");
    tx.objectStore(DB_STORE).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function fetchFromAPI(word) {
  const url = `https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error("not_found");
  return res.json();
}
/* 英 → 中 */
async function translateToChinese(text) {
  if (!text || !text.trim()) return "";
  try {
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.slice(0, 200))}&langpair=en|zh-CN`;
    const res = await fetch(url);
    if (!res.ok) return "";
    const json = await res.json();
    const t = json?.responseData?.translatedText || "";
    if (!t || /^MYMEMORY WARNING/i.test(t)) return "";
    return t;
  } catch (e) { return ""; }
}
/* 中 → 英（新增） */
async function translateToEnglish(text) {
  if (!text || !text.trim()) return "";
  try {
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.slice(0, 200))}&langpair=zh-CN|en`;
    const res = await fetch(url);
    if (!res.ok) return "";
    const json = await res.json();
    const t = json?.responseData?.translatedText || "";
    if (!t || /^MYMEMORY WARNING/i.test(t)) return "";
    return t;
  } catch (e) { return ""; }
}

function normalizeApi(apiData, word) {
  const entry = apiData[0] || {};
  const phonetics = entry.phonetics || [];
  const audio = (phonetics.find(p => p.audio) || {}).audio || "";
  const phoneticText = entry.phonetic || (phonetics.find(p => p.text) || {}).text || "";
  const off = OFFLINE_DICT[word.toLowerCase()];
  let firstDef = "";
  const meanings = (entry.meanings || []).map(m => {
    const defs = (m.definitions || []).slice(0, 4).map(d => ({
      definition: d.definition, example: d.example || "",
      synonyms: (d.synonyms || []).slice(0, 4)
    }));
    if (!firstDef && defs[0]?.definition) firstDef = defs[0].definition;
    return { partOfSpeech: m.partOfSpeech, definitions: defs, synonyms: (m.synonyms || []).slice(0, 6) };
  });
  return {
    word: entry.word || word, phonetic: phoneticText, audio,
    cnMeaning: off ? off[1] : "",
    firstDefForTranslation: firstDef,
    meanings, source: "api", cachedAt: Date.now()
  };
}
async function enrichChinese(entry) {
  if (entry.cnMeaning) return;
  const src = entry.firstDefForTranslation || (entry.meanings?.[0]?.definitions?.[0]?.definition) || "";
  if (!src) return;
  const cn = await translateToChinese(src);
  if (cn) entry.cnMeaning = cn;
}

/* ============================================================
 *  7. 查询主流程（★ 中英分流）
 * ============================================================ */
let currentEntry = null;
let currentAudioEl = null;

function isChineseText(text) {
  return /[\u4e00-\u9fa5]/.test(text);
}

async function search(rawInput) {
  const input = String(rawInput || "").trim();
  if (!input) { renderStatus("🔍", "请输入要查询的英文或中文"); return; }

  // ★ 中文 → 中文查询
  if (isChineseText(input)) {
    return searchChinese(input);
  }

  // 英文 → 原流程
  const word = input.toLowerCase();
  if (!/^[a-z][a-z' -]*$/.test(word)) { renderStatus("⚠️", "只支持英文单词或中文查询"); return; }

  searchBtn.disabled = true;
  const cache = loadCache();

  if (cache[word]) {
    currentEntry = cache[word];
    if (!currentEntry.cnMeaning) {
      enrichChinese(currentEntry).then(() => {
        if (currentEntry && currentEntry.word === word) {
          const c = loadCache(); c[word] = currentEntry; saveCache(c);
          renderEntry(currentEntry, "cached");
        }
      });
    }
    renderEntry(currentEntry, "cached");
    pushHistory(word);
    searchBtn.disabled = false;
    return;
  }

  const offline = OFFLINE_DICT[word];
  if (offline) {
    currentEntry = {
      word, phonetic: offline[0], cnMeaning: offline[1],
      firstDefForTranslation: "", meanings: [], source: "offline", cachedAt: Date.now()
    };
    renderEntry(currentEntry, "offline");
    pushHistory(word);
    fetchFromAPI(word).then(async apiData => {
      const enriched = normalizeApi(apiData, word);
      const merged = { ...currentEntry, ...enriched, cnMeaning: currentEntry.cnMeaning || enriched.cnMeaning };
      if (!merged.cnMeaning) await enrichChinese(merged);
      const c = loadCache(); c[word] = merged; saveCache(c);
      if (currentEntry && currentEntry.word === word) {
        currentEntry = merged;
        renderEntry(merged, "offline");
      }
    }).catch(() => {});
    searchBtn.disabled = false;
    return;
  }

  renderStatus("⏳", "正在联网查询…");
  try {
    const apiData = await fetchFromAPI(word);
    const entry = normalizeApi(apiData, word);
    if (!entry.cnMeaning) await enrichChinese(entry);
    const c = loadCache(); c[word] = entry; saveCache(c);
    currentEntry = entry;
    renderEntry(entry, "api");
    pushHistory(word);
  } catch (e) {
    renderStatus("🔌", "本地词典没有该词，且联网查询失败或该词不存在。请检查拼写或网络。");
  } finally {
    searchBtn.disabled = false;
  }
}

/* ============================================================
 *  8. 中文查询
 * ============================================================ */
async function searchChinese(keyword) {
  searchBtn.disabled = true;
  renderStatus("⏳", `正在检索「${keyword}」…`);

  const lower = keyword.toLowerCase();
  const seen = new Set();
  const matches = [];

  // (1) 离线词典匹配
  for (const [word, [phonetic, meaning]] of Object.entries(OFFLINE_DICT)) {
    if (meaning && meaning.toLowerCase().includes(lower)) {
      if (!seen.has(word)) {
        seen.add(word);
        matches.push({ word, phonetic, meaning, src: "离线" });
      }
    }
  }
  // (2) 缓存匹配
  const cache = loadCache();
  for (const [w, data] of Object.entries(cache)) {
    if (data.cnMeaning && data.cnMeaning.toLowerCase().includes(lower) && !seen.has(w)) {
      seen.add(w);
      matches.push({ word: w, phonetic: data.phonetic || "", meaning: data.cnMeaning, src: "缓存" });
    }
  }
  // (3) 生词表匹配
  const wbItems = await wbGetAll();
  for (const it of wbItems) {
    if (it.cnMeaning && it.cnMeaning.toLowerCase().includes(lower) && !seen.has(it.word)) {
      seen.add(it.word);
      matches.push({ word: it.word, phonetic: it.phonetic || "", meaning: it.cnMeaning, src: "生词表" });
    }
  }

  let translationHint = "";

  // (4) 本地无结果 → 在线翻译兜底
  if (matches.length === 0) {
    renderStatus("⏳", `本地无匹配，正在翻译「${keyword}」…`);
    translationHint = await translateToEnglish(keyword);
  }

  searchBtn.disabled = false;
  renderChineseResults(keyword, matches, translationHint);
  pushHistory("中:" + keyword);
}

function renderChineseResults(keyword, matches, translationHint) {
  let html = `<div class="result-card">
    <div class="word-head">
      <span class="word-title">🔍 "${escapeHtml(keyword)}"</span>
      <span class="word-source cn">中文查询</span>
    </div>`;

  if (matches.length > 0) {
    html += `<div style="font-size:12.5px;color:#8a8fa3;margin-bottom:14px;">
      找到 <b style="color:#f39c12;">${matches.length}</b> 个匹配的英文单词（点击查看详情）：
    </div>`;
    matches.forEach(m => {
      html += `<div class="cn-match-item" data-word="${escapeHtml(m.word)}">
        <div class="cn-match-info">
          <div>
            <span class="cn-match-word">${escapeHtml(m.word)}</span>
            ${m.phonetic ? `<span class="cn-match-phonetic">${escapeHtml(m.phonetic)}</span>` : ""}
          </div>
          <div class="cn-match-meaning">${escapeHtml(m.meaning)}</div>
        </div>
        <div class="wb-item-actions">
          <button class="wb-item-btn" data-act="speak" title="朗读">🔊</button>
        </div>
      </div>`;
    });
  } else if (translationHint) {
    const trans = translationHint.trim();
    html += `<div class="cn-meaning" style="border-left-color:#f39c12;background:rgba(243,156,18,0.06);color:#f39c12;">
      <span class="cn-label" style="color:#f39c12;">在线翻译结果</span>
      "${escapeHtml(keyword)}" 的英文翻译是：<b>${escapeHtml(trans)}</b>
    </div>
    <div style="margin-top:10px;text-align:center;">
      <button class="vocab-jump-btn" id="queryTransBtn" data-word="${escapeHtml(trans.toLowerCase())}">
        🔍 立即查询 "${escapeHtml(trans)}"
      </button>
    </div>`;
  } else {
    html += `<div class="status-msg">
      <div class="icon">🤔</div>
      <div>没有找到匹配「${escapeHtml(keyword)}」的单词<br>试试更简短的词，或者手动输入英文</div>
    </div>`;
  }

  html += `</div>`;
  resultArea.innerHTML = html;

  // 点击条目 → 查英文详情
  resultArea.querySelectorAll(".cn-match-item").forEach(el => {
    el.addEventListener("click", (e) => {
      if (e.target.closest(".wb-item-btn")) return;
      const w = el.dataset.word;
      setInputValue(w);
      search(w);
    });
  });
  resultArea.querySelectorAll('.cn-match-item .wb-item-btn[data-act="speak"]').forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const w = btn.closest(".cn-match-item").dataset.word;
      speakText(w);
    });
  });
  document.getElementById("queryTransBtn")?.addEventListener("click", (e) => {
    const w = e.currentTarget.dataset.word;
    if (w) { setInputValue(w); search(w); }
  });
}

/* ============================================================
 *  9. 渲染英文详情
 * ============================================================ */
function renderStatus(icon, msg) {
  resultArea.innerHTML = `
    <div class="result-card">
      <div class="status-msg"><div class="icon">${icon}</div><div>${msg}</div></div>
    </div>`;
}

async function renderEntry(entry, sourceType) {
  const sourceLabel = { cached: "缓存", offline: "离线", api: "联网" }[sourceType] || "来源";
  const sourceCls = sourceType === "offline" ? "offline" : (sourceType === "cached" ? "cached" : "");
  const inWb = await wbHas(entry.word.toLowerCase());

  let html = `<div class="result-card">
    <div class="word-head">
      <span class="word-title">${escapeHtml(entry.word)}</span>
      ${entry.phonetic ? `<span class="word-phonetic">${escapeHtml(entry.phonetic)}</span>` : ""}
      <button class="speak-btn" id="speakBtn" title="朗读">🔊</button>
      <button class="wb-add-btn${inWb ? " added" : ""}" id="wbAddBtn"
              title="${inWb ? "已在生词表，点击移除" : "加入生词表"}">${inWb ? "✓" : "⭐"}</button>
      <span class="word-source ${sourceCls}">${sourceLabel}</span>
    </div>`;

  if (entry.cnMeaning) {
    html += `<div class="cn-meaning">
      <span class="cn-label">中文简译</span>
      ${escapeHtml(entry.cnMeaning)}
    </div>`;
  }

  if (isVocabWord(entry.word)) {
    const safeWord = encodeURIComponent(entry.word.toLowerCase());
    html += `
      <div class="vocab-jump-row">
        <button class="vocab-jump-btn" id="vocabJumpBtn" data-word="${safeWord}">
          🎯 去词汇进化深度学习「${escapeHtml(entry.word)}」
        </button>
      </div>`;
  }

  if (entry.meanings && entry.meanings.length) {
    html += `<div class="meanings-title">英文释义</div>`;
    entry.meanings.forEach(m => {
      html += `<div class="meaning-group">`;
      if (m.partOfSpeech) html += `<span class="pos">${escapeHtml(m.partOfSpeech)}</span>`;
      m.definitions.forEach(d => {
        html += `<div class="def-item"><div class="def-text">${escapeHtml(d.definition)}</div>`;
        if (d.example) html += `<div class="def-example">"${escapeHtml(d.example)}"</div>`;
        if (d.synonyms && d.synonyms.length) {
          html += `<div class="synonyms">近义：${d.synonyms.map(s =>
            `<span class="syn-tag" data-word="${escapeHtml(s)}">${escapeHtml(s)}</span>`).join(" ")}</div>`;
        }
        html += `</div>`;
      });
      html += `</div>`;
    });
  } else if (!entry.cnMeaning) {
    html += `<div class="status-msg" style="padding:16px;">暂无更多释义。</div>`;
  }

  html += `</div>`;
  resultArea.innerHTML = html;

  document.getElementById("speakBtn")?.addEventListener("click", (e) => speakWord(entry, e.currentTarget));

  document.getElementById("wbAddBtn")?.addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    const w = entry.word.toLowerCase();
    const has = btn.classList.contains("added");
    if (has) {
      await wbDelete(w);
      btn.classList.remove("added"); btn.textContent = "⭐";
      btn.title = "加入生词表";
      toast("已从生词表移除", "danger");
    } else {
      await wbAdd({
        word: w, phonetic: entry.phonetic || "",
        cnMeaning: entry.cnMeaning || "", source: sourceType, addedAt: Date.now()
      });
      btn.classList.add("added"); btn.textContent = "✓";
      btn.title = "已在生词表，点击移除";
      toast("已加入生词表");
    }
    refreshWbCount();
    if (paneWordbook.style.display !== "none") renderWordbook();
  });

  document.getElementById("vocabJumpBtn")?.addEventListener("click", (e) => {
    const w = e.currentTarget.dataset.word;
    if (!w) return;
    if (window.parent !== window) {
      window.parent.postMessage({ type: "dict-jump-vocab", word: w }, "*");
    } else {
      location.href = `vocab.html?word=${w}`;
    }
  });

  resultArea.querySelectorAll(".syn-tag").forEach(el => {
    el.addEventListener("click", () => {
      const w = el.dataset.word;
      if (w) { setInputValue(w); search(w); }
    });
  });
}

/* ============================================================
 *  10. 发音
 * ============================================================ */
let lastCancel = 0;
function speakWord(entry, btn) {
  if (entry.audio) {
    try {
      if (currentAudioEl) { currentAudioEl.pause(); currentAudioEl = null; }
      const audio = new Audio(entry.audio);
      currentAudioEl = audio;
      audio.play().catch(() => speakText(entry.word));
      if (btn) {
        btn.classList.add("playing");
        audio.onended = () => btn.classList.remove("playing");
        audio.onerror = () => btn.classList.remove("playing");
      }
      return;
    } catch (e) {}
  }
  speakText(entry.word);
}
function speakText(text) {
  if (!window.speechSynthesis) return;
  const now = Date.now();
  if (speechSynthesis.speaking && now - lastCancel > 300) {
    speechSynthesis.cancel();
    lastCancel = now;
    setTimeout(() => actuallySpeak(text), 60);
  } else actuallySpeak(text);
}
function actuallySpeak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.85; u.volume = 1;
    const voices = speechSynthesis.getVoices();
    const v = voices.find(x => /en-US/i.test(x.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ============================================================
 *  11. 历史 / 快捷词
 * ============================================================ */
function renderHistory() {
  const h = loadHistory();
  if (!h.length) { historyRow.innerHTML = ""; return; }
  historyRow.innerHTML = `<span class="chips-label">最近：</span>` +
    h.map(w => {
      const label = w.startsWith("中:") ? w.slice(2) : w;
      return `<span class="chip-link" data-word="${escapeHtml(label)}">${escapeHtml(label)}</span>`;
    }).join("") +
    `<span class="chip-link chip-clear" id="clearHistoryBtn">清空</span>`;
  historyRow.querySelectorAll(".chip-link[data-word]").forEach(el => {
    el.addEventListener("click", () => {
      const w = el.dataset.word;
      setInputValue(w);
      search(w);
    });
  });
  document.getElementById("clearHistoryBtn")?.addEventListener("click", clearHistory);
}

const QUICK_WORDS = ["declare","obtain","essential","crucial","significant","articulate","comprehend","resilience","innovative","efficient"];
function renderQuick() {
  quickRow.innerHTML = `<span class="chips-label">快捷：</span>` +
    QUICK_WORDS.map(w => `<span class="chip-link" data-word="${w}">${w}</span>`).join("");
  quickRow.querySelectorAll(".chip-link").forEach(el => {
    el.addEventListener("click", () => {
      setInputValue(el.dataset.word);
      search(el.dataset.word);
    });
  });
}

/* ============================================================
 *  12. 生词表 UI
 * ============================================================ */
async function refreshWbCount() {
  const list = await wbGetAll();
  if (list.length > 0) {
    wbTabBadge.style.display = "inline-block";
    wbTabBadge.textContent = String(list.length);
  } else {
    wbTabBadge.style.display = "none";
  }
}

async function renderWordbook() {
  const keyword = (wbSearchInput.value || "").trim().toLowerCase();
  const all = await wbGetAll();
  const list = keyword
    ? all.filter(it => it.word.includes(keyword) || (it.cnMeaning || "").toLowerCase().includes(keyword))
    : all;

  if (list.length === 0) {
    wbList.innerHTML = `
      <div class="wb-empty">
        <div class="icon">${keyword ? "🔍" : "⭐"}</div>
        <div>${keyword ? "没有匹配的生词" : "生词表还是空的<br>在查词结果里点 ⭐ 加入生词表"}</div>
      </div>`;
    return;
  }

  wbList.innerHTML = list.map(it => {
    const date = new Date(it.addedAt);
    const dateStr = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
    return `
      <div class="wb-item" data-word="${escapeHtml(it.word)}">
        <div class="wb-item-info">
          <div class="wb-item-head">
            <span class="wb-item-word">${escapeHtml(it.word)}</span>
            ${it.phonetic ? `<span class="wb-item-phonetic">${escapeHtml(it.phonetic)}</span>` : ""}
          </div>
          ${it.cnMeaning ? `<div class="wb-item-cn">${escapeHtml(it.cnMeaning)}</div>` : ""}
          <div class="wb-item-date">加入于 ${dateStr}</div>
        </div>
        <div class="wb-item-actions">
          <button class="wb-item-btn" data-act="query" title="查询">🔍</button>
          <button class="wb-item-btn" data-act="speak" title="朗读">🔊</button>
          <button class="wb-item-btn danger" data-act="delete" title="删除">🗑</button>
        </div>
      </div>`;
  }).join("");

  wbList.querySelectorAll(".wb-item").forEach(el => {
    const word = el.dataset.word;
    el.querySelectorAll(".wb-item-btn").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        e.stopPropagation();
        const act = btn.dataset.act;
        if (act === "query") {
          switchTab("dict");
          setInputValue(word);
          search(word);
        } else if (act === "speak") {
          speakText(word);
        } else if (act === "delete") {
          await wbDelete(word);
          refreshWbCount();
          renderWordbook();
          toast("已删除", "danger");
        }
      });
    });
    el.addEventListener("click", () => {
      switchTab("dict");
      setInputValue(word);
      search(word);
    });
  });
}

async function exportWordbook() {
  const list = await wbGetAll();
  if (!list.length) { toast("生词表为空，无需导出", "danger"); return; }
  const data = { version: 1, exportedAt: new Date().toISOString(), count: list.length, words: list };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `wordbook-${stamp}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast(`已导出 ${list.length} 个生词`);
}

async function importWordbook(file) {
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    const words = Array.isArray(data?.words) ? data.words : (Array.isArray(data) ? data : null);
    if (!words) throw new Error("格式不正确");
    let n = 0;
    for (const w of words) {
      if (!w || !w.word) continue;
      await wbAdd({
        word: String(w.word).toLowerCase(),
        phonetic: w.phonetic || "",
        cnMeaning: w.cnMeaning || "",
        source: w.source || "import",
        addedAt: w.addedAt || Date.now()
      });
      n++;
    }
    refreshWbCount();
    if (paneWordbook.style.display !== "none") renderWordbook();
    toast(`导入成功：${n} 个生词`);
  } catch (e) {
    toast("导入失败：" + (e.message || "格式错误"), "danger");
  }
}

/* ============================================================
 *  13. Tab
 * ============================================================ */
function switchTab(name) {
  tabsEl.querySelectorAll(".dict-tab").forEach(t => {
    t.classList.toggle("active", t.dataset.tab === name);
  });
  paneDict.style.display = name === "dict" ? "" : "none";
  paneWordbook.style.display = name === "wordbook" ? "" : "none";
  if (name === "wordbook") renderWordbook();
  else searchInput.focus();
}
tabsEl.addEventListener("click", (e) => {
  const tab = e.target.closest(".dict-tab");
  if (tab) switchTab(tab.dataset.tab);
});

/* ============================================================
 *  14. 工具
 * ============================================================ */
function escapeHtml(s) {
  if (s == null) return "";
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function toast(msg, type) {
  const el = document.createElement("div");
  el.className = "dict-toast";
  el.textContent = msg;
  if (type) el.dataset.type = type;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => el.remove(), 300);
  }, 1800);
}

/* ============================================================
 *  15. 事件 + 初始化
 * ============================================================ */
searchBtn.addEventListener("click", () => search(searchInput.value));
searchInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); search(searchInput.value); }
});
searchInput.addEventListener("input", () => {
  clearBtn.classList.toggle("show", !!searchInput.value);
});
clearBtn.addEventListener("click", () => {
  setInputValue("");
  searchInput.focus();
});
wbSearchInput.addEventListener("input", () => renderWordbook());
document.getElementById("wbExportBtn").addEventListener("click", exportWordbook);
document.getElementById("wbImportBtn").addEventListener("click", () => {
  document.getElementById("wbImportFile").click();
});
document.getElementById("wbImportFile").addEventListener("change", (e) => {
  const f = e.target.files?.[0];
  if (f) importWordbook(f);
  e.target.value = "";
});
document.getElementById("wbClearBtn").addEventListener("click", async () => {
  if (!confirm("确定清空生词表？此操作无法撤销（建议先导出备份）")) return;
  await wbClear();
  refreshWbCount();
  renderWordbook();
  toast("已清空生词表", "danger");
});

/* embed 模式 */
const params = new URLSearchParams(location.search);
const isEmbed = params.get("embed") === "1";
if (isEmbed) {
  document.documentElement.classList.add("embed-mode");
  const header = document.getElementById("pageHeader");
  if (header) header.style.display = "none";
}

/* iframe 消息 */
window.addEventListener("message", (e) => {
  const d = e.data;
  if (!d || typeof d !== "object") return;
  if (d.type === "dict-query" && d.word) {
    switchTab("dict");
    setInputValue(d.word);
    search(d.word);
  }
});

if (window.speechSynthesis) {
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => {};
}

renderHistory();
renderQuick();
refreshWbCount();

/* URL 参数直达 */
const paramW = params.get("w");
if (paramW) {
  setInputValue(paramW);
  search(paramW);
} else {
  renderStatus("👋", "输入英文或中文开始查词。点 ⭐ 可加入生词表，随时导出备份。");
}

/* 动态加载 nav.js（仅非 embed 模式） */
if (!isEmbed) {
  const s = document.createElement("script");
  s.src = "nav.js";
  document.body.appendChild(s);
}
</script>
