<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1a1a2e" />
<meta name="description" content="Daily English 英语学习工具箱：词汇进化、Daily Chat、1000句高频单句训练。" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>Daily English · 英语学习工具箱</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh; /* 移动端地址栏收起时更稳定 */
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    background-attachment: fixed;
    color: #e8e8e8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top));
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }

  /* ---------- 顶部标题 ---------- */
  .landing-header {
    text-align: center;
    margin-bottom: 32px;
  }
  .landing-header h1 {
    font-size: 28px;
    margin: 0 0 8px;
    font-weight: 800;
    color: #00e5ff; /* 渐变不生效时的兜底色 */
    background: linear-gradient(135deg, #00e5ff, #d500f9);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .landing-header p {
    margin: 0;
    color: #8a8fa3;
    font-size: 14px;
  }

  /* ---------- 卡片网格 ---------- */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    width: 100%;
    max-width: 720px;
  }

  .app-card {
    display: block;
    position: relative;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.04);
    border: 1.5px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 24px;
    text-decoration: none;
    color: inherit;
    transition: transform .2s, border-color .2s, background .2s, box-shadow .2s;
  }
  .app-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #00e5ff, #d500f9);
    opacity: 0.6;
  }
  .app-card:hover {
    border-color: #00e5ff;
    background: rgba(0, 229, 255, 0.06);
    transform: translateY(-3px);
    box-shadow: 0 8px 32px rgba(0, 229, 255, 0.15);
  }
  .app-card:focus-visible {
    outline: 2px solid #00e5ff;
    outline-offset: 3px;
  }

  .app-card .icon {
    display: block;
    font-size: 40px;
    line-height: 1;
    margin-bottom: 12px;
  }
  .app-card .title {
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 6px;
  }
  .app-card .desc {
    font-size: 13px;
    line-height: 1.6;
    color: #8a8fa3;
    min-height: 42px; /* 两行高度，保证多卡片对齐 */
  }
  .app-card .arrow {
    margin-top: 16px;
    font-size: 12px;
    font-weight: 600;
    color: #00e5ff;
  }

  /* ---------- 禁用 JS 时的提示 ---------- */
  .no-script {
    max-width: 720px;
    margin-top: 16px;
    padding: 16px 20px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.04);
    color: #8a8fa3;
    font-size: 13px;
    line-height: 1.6;
    text-align: center;
  }

  /* ---------- 减少动效偏好 ---------- */
  @media (prefers-reduced-motion: reduce) {
    .app-card,
    .app-card::before {
      transition: none !important;
    }
    .app-card:hover {
      transform: none;
    }
  }
</style>
</head>
<body>
  <header class="landing-header">
    <h1>📚 Daily English</h1>
    <p>选择你要练习的应用</p>
  </header>

  <main class="cards" id="cards"></main>

  <noscript>
    <p class="no-script">此页面需要启用 JavaScript 才能显示应用列表，请在浏览器设置中开启后刷新。</p>
  </noscript>

  <script src="nav.js"></script>
  <script>
  (function () {
    'use strict';

    /* 兜底数据：nav.js 未提供可用配置时使用 */
    var FALLBACK_APPS = {
      vocab:   { icon: '🎯', title: '词汇进化',   href: 'vocab.html',   desc: '每周消灭 50 个 Comfort Word' },
      chat:    { icon: '💬', title: 'Daily Chat', href: 'chat.html',    desc: '201 组地道日常对话跟读' },
      grammar: { icon: '📝', title: '1000句单句', href: 'phrases.html', desc: '1000句高频单句训练' },
      dict:    { icon: '📖', title: '查词',       href: 'dictionary.html', desc: '离线词典 + 联网释义 + 中文简译' }
    };

    /* 读取 nav.js 暴露的配置，非空对象才采用 */
    var custom = window.DAILY_ENGLISH_APPS;
    var apps = (custom && typeof custom === 'object' && Object.keys(custom).length > 0)
      ? custom
      : FALLBACK_APPS;

    var container = document.getElementById('cards');
    if (!container) return;

    var frag = document.createDocumentFragment();

    Object.keys(apps).forEach(function (key) {
      var app = apps[key];
      if (!app || typeof app !== 'object' || !app.href) return;

      var card = document.createElement('a');
      card.className = 'app-card';
      card.href = app.href;

      var icon = document.createElement('span');
      icon.className = 'icon';
      icon.textContent = app.icon || '📄';
      icon.setAttribute('aria-hidden', 'true');

      var title = document.createElement('div');
      title.className = 'title';
      title.textContent = app.title || key;

      var desc = document.createElement('div');
      desc.className = 'desc';
      desc.textContent = app.desc || '';

      var arrow = document.createElement('div');
      arrow.className = 'arrow';
      arrow.textContent = '进入 →';

      card.append(icon, title, desc, arrow);
      frag.appendChild(card);
    });

    container.appendChild(frag);

    /* 注册 Service Worker（需同目录存在 sw.js；不存在时静默失败） */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {
          /* 未提供 sw.js 或注册失败时忽略，不影响页面功能 */
        });
      });
    }
  })();
  </script>
</body>
</html>
