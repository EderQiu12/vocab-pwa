<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#6C5CE7" />
<title>高频单句拼接训练 · 1000句</title>
<style>
/* ========== 全局样式 ========== */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh; color: #e8e8e8;
  padding-bottom: env(safe-area-inset-bottom);
}
.app { max-width: 900px; margin: 0 auto; padding: 16px; }

.header { text-align: center; padding: 10px 0 16px; }
.header h1 {
  font-size: 26px; font-weight: 800;
  background: linear-gradient(135deg, #a29bfe, #6C5CE7, #00cec9);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 6px;
}
.header .subtitle { font-size: 13px; color: #8a8fa3; }
.progress-bar { margin-top: 12px; background: rgba(255,255,255,0.08); border-radius: 10px; height: 8px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, #6C5CE7, #00cec9); border-radius: 10px; transition: width 0.3s; width: 0%; }
.progress-text { font-size: 12px; color: #8a8fa3; margin-top: 6px; }

.quick-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0; }
.quick-stat { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px 8px; text-align: center; }
.quick-stat .qs-val { font-size: 20px; font-weight: 800; color: #fff; }
.quick-stat .qs-lbl { font-size: 11px; color: #8a8fa3; margin-top: 2px; }

/* 场景分类卡片 */
.scene-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin: 20px 0; }
.scene-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 16px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
.scene-card:hover { border-color: rgba(108, 92, 231, 0.5); background: rgba(108, 92, 231, 0.1); transform: translateY(-2px); }
.scene-card .scene-icon { font-size: 28px; margin-bottom: 8px; }
.scene-card .scene-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.scene-card .scene-count { font-size: 11px; color: #8a8fa3; }
.scene-card .scene-progress-dot { position: absolute; top: 12px; right: 12px; width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.2); }
.scene-card .scene-progress-dot.done { background: #00b894; }
.scene-card .scene-mini-bar { position: absolute; bottom: 0; left: 0; height: 3px; background: linear-gradient(90deg, #6C5CE7, #00cec9); border-radius: 0 3px 3px 0; }

/* 列表 */
.sl-grid { display: grid; gap: 8px; }
.sl-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 12px 14px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 10px; }
.sl-item:hover { border-color: rgba(108, 92, 231, 0.4); background: rgba(108, 92, 231, 0.08); }
.sl-item.done { border-color: rgba(0, 184, 148, 0.4); background: rgba(0, 184, 148, 0.05); }
.sl-num { font-size: 12px; color: #8a8fa3; min-width: 28px; }
.sl-item.done .sl-num { color: #00b894; }
.sl-content { flex: 1; min-width: 0; }
.sl-en { font-size: 14px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sl-cn { font-size: 12px; color: #8a8fa3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sl-check { color: #00b894; font-size: 16px; flex-shrink: 0; }

/* 按钮 */
.btn { padding: 12px 24px; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.15s; }
.btn-primary { background: linear-gradient(135deg, #6C5CE7, #a29bfe); color: white; box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4); }
.btn-secondary { background: rgba(255,255,255,0.08); color: #d8dce8; border: 1px solid rgba(255,255,255,0.15); }
.btn-block { width: 100%; margin: 8px 0; }
.btn-row { display: flex; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
.btn-row .btn { flex: 1; min-width: 120px; }

/* 练习全屏页 */
.practice-screen { position: fixed; inset: 0; z-index: 100; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); transform: translateY(100%); visibility: hidden; transition: transform 0.3s ease, visibility 0.3s; display: flex; flex-direction: column; }
.practice-screen.open { transform: translateY(0); visibility: visible; }
body.practice-open { overflow: hidden; }

.ps-top { flex: none; padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top)); border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(26, 26, 46, 0.9); backdrop-filter: blur(10px); }
.ps-top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.ps-back { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #d8dce8; padding: 8px 14px; border-radius: 10px; font-size: 14px; cursor: pointer; font-family: inherit; }
.ps-scene-name { font-size: 13px; color: #a29bfe; font-weight: 600; }
.ps-progress { font-size: 12px; color: #8a8fa3; font-variant-numeric: tabular-nums; }

.ps-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
.ps-stat { background: rgba(255,255,255,0.04); border-radius: 10px; padding: 8px; text-align: center; }
.ps-stat-val { font-size: 18px; font-weight: 800; }
.ps-stat-val.time { color: #00cec9; }
.ps-stat-val.score { color: #fdcb6e; }
.ps-stat-val.combo { color: #e17055; }
.ps-stat-lbl { font-size: 10px; color: #8a8fa3; }

.ps-middle { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }

/* 历史记录区 */
.history-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.history-item { background: rgba(255,255,255,0.02); border-radius: 12px; padding: 12px 16px; border: 1px dashed rgba(255,255,255,0.1); opacity: 0.6; }
.history-item .h-cn { color: #8a8fa3; margin-bottom: 4px; font-size: 13px; font-style: italic; }
.history-item .h-en { color: #00b894; font-size: 15px; }

/* 当前句子卡片 */
.sentence-box { background: rgba(0,0,0,0.3); border-radius: 16px; padding: 24px; border: 1px solid rgba(255,255,255,0.06); min-height: 120px; cursor: pointer; transition: background 0.2s; }
.sentence-box:hover { background: rgba(0,0,0,0.4); }
.sentence-cn { font-size: 15px; color: #a29bfe; margin-bottom: 16px; font-style: italic; }
.sentence-en { font-size: 26px; line-height: 1.6; font-weight: 500; letter-spacing: 0.5px; word-break: break-word; min-height: 50px; }
.sentence-en .char { display: inline-block; padding: 2px 1px; border-radius: 4px; color: #4a5070; transition: all 0.1s; position: relative; }
.sentence-en .char.correct { color: #00b894; }
.sentence-en .char.incorrect { color: #d63031; background: rgba(214, 48, 49, 0.2); }
.sentence-en .char.current::after { content: ""; position: absolute; bottom: -2px; left: 0; right: 0; height: 3px; background: #a29bfe; border-radius: 2px; animation: blink 0.9s infinite; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

.ps-bottom { flex: none; border-top: 1px solid rgba(255,255,255,0.1); background: rgba(22, 33, 62, 0.95); backdrop-filter: blur(10px); padding: 12px 16px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); max-height: 55vh; overflow-y: auto; }

/* 单词块区域 */
.chips-area { background: rgba(108, 92, 231, 0.05); border: 1px dashed rgba(108, 92, 231, 0.3); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
.chips-title { font-size: 12px; color: #8a8fa3; margin-bottom: 10px; }
.chips-title b { color: #a29bfe; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #e8e8e8; border-radius: 10px; padding: 10px 14px; font-size: 16px; line-height: 1.3; cursor: pointer; user-select: none; transition: all 0.15s; min-height: 44px; display: inline-flex; align-items: center; }
.chip:hover { background: rgba(108, 92, 231, 0.2); border-color: rgba(108, 92, 231, 0.5); color: #a29bfe; }
.chip.used { opacity: 0.3; text-decoration: line-through; background: rgba(0, 184, 148, 0.1); border-color: rgba(0, 184, 148, 0.3); cursor: not-allowed; }
.chip.wrong { animation: chipShake 0.3s; background: rgba(214, 48, 49, 0.2); border-color: rgba(214, 48, 49, 0.6); color: #d63031; }
.chip.focused { background: rgba(108, 92, 231, 0.3); border-color: #a29bfe; color: #fff; outline: 2px solid #a29bfe; outline-offset: 2px; box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.2); }
@keyframes chipShake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

.input-show { width: 100%; padding: 14px 16px; font-size: 17px; border: 2px dashed rgba(108, 92, 231, 0.4); border-radius: 12px; background: rgba(108, 92, 231, 0.05); color: #e8e8e8; margin-bottom: 8px; min-height: 52px; word-break: break-word; }
.input-hint { font-size: 11px; color: #6a7090; text-align: center; margin-bottom: 12px; }

.popup { position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0); font-size: 42px; font-weight: 900; pointer-events: none; z-index: 200; text-align: center; opacity: 0; }
.popup.combo { color: #fdcb6e; text-shadow: 0 4px 20px rgba(253, 203, 110, 0.5); }
.popup.perfect { color: #00b894; text-shadow: 0 4px 20px rgba(0, 184, 148, 0.5); }
.popup.show { animation: popAnim 1s ease-out; }
@keyframes popAnim { 0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; } 30% { transform: translate(-50%, -60%) scale(1.2); opacity: 1; } 100% { transform: translate(-50%, -100%) scale(0.8); opacity: 0; } }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 300; padding: 20px; }
.modal-overlay.show { display: flex; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); border: 1px solid rgba(0, 184, 148, 0.4); border-radius: 20px; padding: 32px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 8px 60px rgba(0, 184, 148, 0.2); animation: slideUp 0.4s ease; }
@keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal .modal-icon { font-size: 56px; margin-bottom: 12px; }
.modal h2 { font-size: 22px; color: #00b894; margin-bottom: 8px; }
.modal p { color: #888; font-size: 13px; margin-bottom: 20px; }
.modal .modal-stats { display: flex; gap: 12px; justify-content: center; margin-bottom: 24px; flex-wrap: wrap; }
.modal .m-stat { background: rgba(255,255,255,0.06); border-radius: 12px; padding: 12px 16px; min-width: 80px; }
.modal .m-val { font-size: 22px; font-weight: 800; color: #a29bfe; }
.modal .m-lbl { font-size: 11px; color: #888; margin-top: 2px; }

@media (max-width: 600px) {
  .app { padding: 12px; }
  .header h1 { font-size: 24px; }
  .sentence-en { font-size: 22px; }
  .chip { font-size: 15px; padding: 10px 12px; }
  .scene-grid { grid-template-columns: repeat(2, 1fr); }
  .quick-stats { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>💬 1000句高频单句训练</h1>
    <div class="subtitle">覆盖10大生活场景 · 沉浸式拼接记忆 · 支持键盘 WASD/HJKL</div>
    <div class="progress-bar">
      <div class="progress-fill" id="totalProgressFill"></div>
    </div>
    <div class="progress-text" id="totalProgressText">已掌握 0 / 1000 句</div>
  </div>

  <div class="quick-stats">
    <div class="quick-stat"><div class="qs-val" id="statLearned">0</div><div class="qs-lbl">✅ 已学会</div></div>
    <div class="quick-stat"><div class="qs-val" id="statAccuracy">0%</div><div class="qs-lbl">🎯 正确率</div></div>
    <div class="quick-stat"><div class="qs-val" id="statCombo">0</div><div class="qs-lbl">🔥 最高连击</div></div>
    <div class="quick-stat"><div class="qs-val" id="statScore">0</div><div class="qs-lbl">⭐ 总得分</div></div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" onclick="startRandomPractice()">🎲 随机练习(20句)</button>
    <button class="btn btn-secondary" onclick="resetProgress()">🔄 重置进度</button>
  </div>

  <h3 style="font-size:16px;margin:20px 0 12px;color:#d8dce8;">📚 场景分类</h3>
  <div class="scene-grid" id="sceneGrid"></div>

  <!-- 句子列表区 -->
  <div id="sentenceListArea" style="display:none;">
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="backToScenes()">← 返回场景</button>
      <button class="btn btn-primary" onclick="startScenePractice()">🚀 开始练习本场景</button>
    </div>
    <div class="sentence-list-panel">
      <div class="sentence-list-header" style="display:flex; justify-content:space-between; margin-bottom:12px;">
        <span class="sentence-list-title" id="currentSceneTitle" style="font-weight:600;"></span>
        <span id="sceneProgressText" style="font-size:12px;color:#8a8fa3;"></span>
      </div>
      <div class="sl-grid" id="sentenceList"></div>
    </div>
  </div>
</div>

<!-- 练习全屏页面 -->
<div class="practice-screen" id="practiceScreen">
  <div class="ps-top">
    <div class="ps-top-row">
      <button class="ps-back" onclick="exitPractice()">← 返回</button>
      <span class="ps-scene-name" id="psSceneName"></span>
      <span class="ps-progress" id="psProgress"></span>
    </div>
    <div class="ps-stats">
      <div class="ps-stat"><div class="ps-stat-val time" id="psTimer">0s</div><div class="ps-stat-lbl">⏱ 用时</div></div>
      <div class="ps-stat"><div class="ps-stat-val score" id="psScore">0</div><div class="ps-stat-lbl">⭐ 本句得分</div></div>
      <div class="ps-stat"><div class="ps-stat-val combo" id="psCombo">0</div><div class="ps-stat-lbl">🔥 连击</div></div>
    </div>
  </div>

  <div class="ps-middle" id="psMiddle">
    <!-- 历史记录区（前5句） -->
    <div class="history-list" id="historyList"></div>
    
    <!-- 当前句子区（点击可朗读） -->
    <div class="sentence-box" onclick="speakCurrent()">
      <div class="sentence-cn" id="psCn"></div>
      <div class="sentence-en" id="psEn"></div>
    </div>
  </div>

  <div class="ps-bottom">
    <div class="chips-area" id="chipsArea">
      <div class="chips-title">🧩 <b>单词顺序已打乱</b>，依次点击正确的单词拼出整句（支持键盘 WASD/HJKL 选择，↑/Enter 选中）</div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="input-show" id="inputShow"></div>
    <div class="input-hint" id="inputHint">💡 点击上方单词按正确顺序拼接句子</div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="prevSentence()">← 上一句</button>
      <button class="btn btn-secondary" onclick="nextSentence()">下一句 →</button>
    </div>
  </div>
</div>

<div class="popup combo" id="comboPopup"></div>
<div class="popup perfect" id="perfectPopup"></div>

<!-- 完成弹窗 -->
<div class="modal-overlay" id="completeModal">
  <div class="modal">
    <div class="modal-icon">🎉</div>
    <h2>练习完成！</h2>
    <p>太棒了，继续保持！</p>
    <div class="modal-stats">
      <div class="m-stat"><div class="m-val" id="modalCorrect">0</div><div class="m-lbl">✅ 正确</div></div>
      <div class="m-stat"><div class="m-val" id="modalAccuracy">0%</div><div class="m-lbl">🎯 正确率</div></div>
      <div class="m-stat"><div class="m-val" id="modalCombo">0</div><div class="m-lbl">🔥 最高连击</div></div>
    </div>
    <button class="btn btn-primary btn-block" onclick="closeModal()">继续学习</button>
  </div>
</div>

<script>
// ============================================================
//  1000句数据（完整版）
// ============================================================
const SENTENCES_RAW = `
1. How’s everything going? 一切都还好吗？
2. Long time no see. 好久不见。
3. What have you been up to lately? 你最近在忙什么？
4. I’ve been pretty busy lately. 我最近挺忙的。
5. How was your weekend? 你周末过得怎么样？
6. It was pretty relaxing. 过得特别放松。
7. How are you doing? 你还好吗？
8. I’m doing great, thanks. 我挺好的，谢谢。
9. Not too bad, all things considered. 总的来说还不赖。
10. I’m hanging in there. 我勉强撑着呢。
11. It’s been ages since we last met. 我们上次见面都过去好久了。
12. Good to catch up with you. 很高兴和你叙叙旧。
13. How’s life treating you these days? 最近日子过得顺心吗？
14. Same old, nothing special. 老样子，没什么特别的。
15. Can’t complain too much. 没什么可抱怨的。
16. Hope you’re keeping well. 希望你一切安好。
17. It’s great to hear from you. 很高兴收到你的消息。
18. Sorry I haven’t been around much. 抱歉最近很少露面。
19. I’ve been a little under the weather. 我最近身体有点不舒服。
20. Things have been a bit hectic. 最近事情有点忙乱。
21. How’s your new job going? 你的新工作怎么样？
22. It’s going better than I expected. 比我预想的顺利。
23. How’s your family doing? 你的家人最近还好吗？
24. They’re all doing well, thanks. 他们都挺好的，谢谢。
25. Long time no chat. 好久没聊天了。
26. What’s new with you? 你那边有什么新鲜事？
27. Not much, just the usual. 没什么，还是老样子。
28. How did your trip go? 你的旅途顺利吗？
29. It was absolutely amazing. 旅途特别棒。
30. Glad things are working out for you. 很高兴看到你一切顺利。
31. How’s your new place working out? 你的新家住得还习惯吗？
32. It’s really comfortable to live in. 住起来特别舒服。
33. How’s your workload these days? 最近工作忙不忙？
34. I’ve been swamped with work. 我最近忙得不可开交。
35. How’s your health holding up? 你的身体状态怎么样？
36. I’m feeling much better now. 我现在好多了。
37. Good morning! 早上好！
38. Good afternoon! 下午好！
39. Good evening! 晚上好！
40. Good night! 晚安！
41. See you later. 回头见。
42. Catch you tomorrow. 明天见。
43. Talk to you soon. 很快再聊。
44. Keep in touch. 保持联系。
45. Take care of yourself. 照顾好自己。
46. Have a nice day! 祝你今天过得愉快！
47. Enjoy your day off! 祝你休息日玩得开心！
48. Have a safe trip. 一路平安。
49. Cheers for now. 先拜拜啦。
50. Until next time. 下次再见。
51. Fancy meeting you here! 真巧在这儿碰到你！
52. What a small world! 世界真小啊！
53. I didn’t expect to see you here. 我没想到会在这儿见到你。
54. You look familiar. 你看起来很眼熟。
55. Haven’t we met somewhere before? 我们之前是不是在哪里见过？
56. It’s so nice to see you again. 再次见到你真开心。
57. You look great today. 你今天气色真好。
58. Thank you, you too. 谢谢，你也是。
59. How come you’re here? 你怎么会在这里？
60. I’m just here for a coffee. 我就是来这儿喝杯咖啡的。
61. What brings you here? 什么风把你吹来了？
62. I’m here to pick up a friend. 我来这儿接个朋友。
63. It’s been a really long day. 今天真是漫长的一天。
64. I can totally relate. 我太懂这种感觉了。
65. The weather is so nice today. 今天天气真好。
66. Yeah, perfect for a walk. 对啊，特别适合散步。
67. It’s freezing outside today. 今天外面特别冷。
68. I totally forgot to bring my coat. 我完全忘了带外套。
69. It’s pouring with rain outside. 外面正在下倾盆大雨。
70. Did you bring an umbrella? 你带伞了吗？
71. The traffic is terrible today. 今天交通特别堵。
72. I spent an hour stuck on the road. 我在路上堵了一个小时。
73. You won’t believe what happened to me today. 你绝对想不到我今天遇到了什么事。
74. Do tell me. 快说给我听听。

// 解析句子
function parseSentences() {
  const sentences = [];
  const lines = SENTENCES_RAW.trim().split('\n');
  const regex = /^(\d+)\.\s+(.+?)\s+([\u4e00-\u9fa5].+)$/;
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed) continue;
    const match = trimmed.match(regex);
    if (match) {
      sentences.push({ id: parseInt(match[1]), en: match[2].trim(), cn: match[3].trim() });
    }
  }
  return sentences;
}
const ALL_SENTENCES = parseSentences();

// 进度持久化
function loadState() {
  try {
    const saved = localStorage.getItem('phrases_state');
    if (saved) {
      const data = JSON.parse(saved);
      state.learned = new Set(data.learned || []);
      state.totalScore = data.totalScore || 0;
      state.totalAttempts = data.totalAttempts || 0;
      state.totalCorrect = data.totalCorrect || 0;
      state.maxCombo = data.maxCombo || 0;
    }
  } catch (e) {}
}
function saveState() {
  localStorage.setItem('phrases_state', JSON.stringify({
    learned: Array.from(state.learned),
    totalScore: state.totalScore, totalAttempts: state.totalAttempts,
    totalCorrect: state.totalCorrect, maxCombo: state.maxCombo,
  }));
}

// ============================================================
let voices = [];
function loadVoices() { voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en')); }
if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();
function speak(text) {
  if (!text) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 0.85;
  const preferred = voices.find(v => /en[-_](US|GB)/i.test(v.lang) && /female|samantha/i.test(v.name)) || voices.find(v => v.lang.startsWith('en'));
  if (preferred) utter.voice = preferred;
  speechSynthesis.speak(utter);
}
function speakCurrent() {
  if (practice.current) speak(practice.current.en);
}

  const total = ALL_SENTENCES.length;
  const learned = state.learned.size;
  const percent = Math.round(learned / total * 100);
  $('totalProgressFill').style.width = percent + '%';
  $('totalProgressText').textContent = `已掌握 ${learned} / ${total} 句 (${percent}%)`;
  $('statLearned').textContent = learned;
  $('statAccuracy').textContent = state.totalAttempts > 0 ? Math.round(state.totalCorrect / state.totalAttempts * 100) + '%' : '0%';
  $('statCombo').textContent = state.maxCombo;
  $('statScore').textContent = state.totalScore;
}

function renderScenes() {
  const grid = $('sceneGrid');
  grid.innerHTML = '';
  SCENES.forEach(scene => {
    const sceneSentences = ALL_SENTENCES.filter(s => s.id >= scene.range[0] && s.id <= scene.range[1]);
    const doneCount = sceneSentences.filter(s => state.learned.has(s.id)).length;
    const percent = Math.round(doneCount / sceneSentences.length * 100);
    
    const card = document.createElement('div');
    card.className = 'scene-card';
    card.innerHTML = `
      <div class="scene-progress-dot ${doneCount === sceneSentences.length ? 'done' : ''}"></div>
      <div class="scene-mini-bar" style="width:${percent}%"></div>
      <div class="scene-icon">${scene.icon}</div>
      <div class="scene-name">${scene.name}</div>
      <div class="scene-count">${sceneSentences.length}句 · 已完成${doneCount}句</div>
    `;
    card.onclick = () => openScene(scene);
    grid.appendChild(card);
  });
}

let currentScene = null;
function openScene(scene) {
  currentScene = scene;
  $('sceneGrid').style.display = 'none';
  $('sentenceListArea').style.display = 'block';
  $('currentSceneTitle').textContent = `${scene.icon} ${scene.name}`;
  
  const list = $('sentenceList');
  list.innerHTML = '';
  const sentences = ALL_SENTENCES.filter(s => s.id >= scene.range[0] && s.id <= scene.range[1]);
  const doneCount = sentences.filter(s => state.learned.has(s.id)).length;
  $('sceneProgressText').textContent = `${doneCount} / ${sentences.length} 已完成`;
  
  sentences.forEach(s => {
    const item = document.createElement('div');
    item.className = 'sl-item' + (state.learned.has(s.id) ? ' done' : '');
    item.innerHTML = `
      <span class="sl-num">${s.id}</span>
      <div class="sl-content">
        <div class="sl-en">${s.en}</div>
        <div class="sl-cn">${s.cn}</div>
      </div>
      ${state.learned.has(s.id) ? '<span class="sl-check">✓</span>' : ''}
    `;
    item.onclick = () => startPractice([s], 0, currentScene.name);
    list.appendChild(item);
  });
}

function backToScenes() {
  $('sceneGrid').style.display = 'grid';
  $('sentenceListArea').style.display = 'none';
  currentScene = null;
  updateHomeStats();
  renderScenes();
}

function startScenePractice() {
  if (!currentScene) return;
  const sentences = ALL_SENTENCES.filter(s => s.id >= currentScene.range[0] && s.id <= currentScene.range[1]);
  const unlearned = sentences.filter(s => !state.learned.has(s.id));
  const toPractice = unlearned.length > 0 ? unlearned : sentences;
  startPractice([...toPractice].sort(() => Math.random() - 0.5), 0, currentScene.name);
}

function startRandomPractice() {
  const unlearned = ALL_SENTENCES.filter(s => !state.learned.has(s.id));
  const pool = unlearned.length > 20 ? unlearned : ALL_SENTENCES;
  const shuffled = [...pool].sort(() => Math.random() - 0.5).slice(0, 20);
  startPractice(shuffled, 0, '随机练习');
}

function startPractice(sentences, startIndex, sceneName) {
  practice.list = sentences;
  practice.index = startIndex;
  practice.correctCount = 0;
  practice.combo = 0;
  practice.score = 0;
  practice.errors = 0;
  practice.startTime = Date.now();
  
  $('psSceneName').textContent = sceneName;
  $('practiceScreen').classList.add('open');
  document.body.classList.add('practice-open');
  
  if (practice.timer) clearInterval(practice.timer);
  practice.timer = setInterval(() => {
    const elapsed = Math.floor((Date.now() - practice.startTime) / 1000);
    $('psTimer').textContent = elapsed + 's';
  }, 1000);
  
  loadSentence();
}

function exitPractice() {
  $('practiceScreen').classList.remove('open');
  document.body.classList.remove('practice-open');
  if (practice.timer) clearInterval(practice.timer);
  speechSynthesis.cancel();
  saveState();
  backToScenes();
  
  if (practice.correctCount > 0) {
    showCompleteModal();
    practice.correctCount = 0;
  }
}

// ============================================================
//  核心逻辑
// ============================================================
function loadSentence() {
  if (practice.index >= practice.list.length) {
    exitPractice();
    return;
  }
  
  const s = practice.list[practice.index];
  practice.current = s;
  practice.userInput = '';
  practice.errors = 0;
  practice.matchedIndex = 0;
  practice.usedIndices.clear();
  practice.chipFocus = -1;
  
  $('psProgress').textContent = `${practice.index + 1} / ${practice.list.length}`;
  $('psCn').textContent = s.cn;
  $('psScore').textContent = practice.score;
  $('psCombo').textContent = practice.combo;
  
  practice.targetTokens = [];
  const regex = /[a-zA-Z0-9'’\-]+[.,!?;:]*/g;
  let match;
  while ((match = regex.exec(s.en)) !== null) {
    practice.targetTokens.push({ text: match[0], start: match.index, end: match.index + match[0].length });
  }
  
  practice.shuffledIndices = Array.from({ length: practice.targetTokens.length }, (_, i) => i);
  for (let i = practice.shuffledIndices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [practice.shuffledIndices[i], practice.shuffledIndices[j]] = [practice.shuffledIndices[j], practice.shuffledIndices[i]];
  }
  if (practice.shuffledIndices.join(',') === Array.from({ length: practice.targetTokens.length }, (_, i) => i).join(',') && practice.targetTokens.length > 2) {
    [practice.shuffledIndices[0], practice.shuffledIndices[1]] = [practice.shuffledIndices[1], practice.shuffledIndices[0]];
  }
  
  renderHistory();
  setupUI();
  
  setTimeout(() => {
    if (localStorage.getItem('autoSpeak') !== 'false') speak(s.en);
  }, 300);
}

function renderHistory() {
  const container = $('historyList');
  container.innerHTML = '';
  const start = Math.max(0, practice.index - 5);
  for (let i = start; i < practice.index; i++) {
    const item = practice.list[i];
    const div = document.createElement('div');
    div.className = 'history-item';
    div.innerHTML = `
      <div class="h-cn">${item.cn}</div>
      <div class="h-en">${item.en}</div>
    `;
    container.appendChild(div);
  }
  setTimeout(() => {
    $('psMiddle').scrollTop = $('psMiddle').scrollHeight;
  }, 50);
}

function setupUI() {
  renderSentenceMask();
  
  const chipsContainer = $('chips');
  chipsContainer.innerHTML = '';
  practice.shuffledIndices.forEach(idx => {
    const tokenData = practice.targetTokens[idx];
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = tokenData.text;
    chip.dataset.idx = idx;
    chip.onclick = () => clickChip(idx, tokenData.text, chip);
    chipsContainer.appendChild(chip);
  });
  
  $('inputShow').textContent = '';
}

function renderSentenceMask() {
  const container = $('psEn');
  container.innerHTML = '';
  const sentence = practice.current.en;
  for (let i = 0; i < sentence.length; i++) {
    const ch = document.createElement('span');
    ch.className = 'char masked';
    ch.innerHTML = sentence[i] === ' ' ? '&nbsp;' : sentence[i]; 
    container.appendChild(ch);
  }
}

function updateSentenceDisplay() {
  const sentence = practice.current.en;
  const chars = $('psEn').querySelectorAll('.char');
  const inputLen = practice.userInput.length;

  for (let i = 0; i < chars.length; i++) {
    chars[i].classList.remove('correct', 'incorrect', 'current', 'masked');
    if (i < inputLen) {
      if (sentence[i] === practice.userInput[i]) {
        chars[i].classList.add('correct');
      } else {
        chars[i].classList.add('incorrect');
      }
    } else if (i === inputLen) {
      chars[i].classList.add('current');
    } else {
      chars[i].classList.add('masked');
    }
  }
}

function clickChip(tokenIndex, word, chipEl) {
  if (practice.usedIndices.has(tokenIndex)) return;
  
  const expectedToken = practice.targetTokens[practice.matchedIndex];
  
  if (word === expectedToken.text) {
    practice.usedIndices.add(tokenIndex);
    practice.matchedIndex++;
    chipEl.classList.add('used');
    
    practice.userInput = practice.current.en.slice(0, expectedToken.end);
    $('inputShow').textContent = practice.userInput;
    
    updateSentenceDisplay();
    
    if (practice.matchedIndex === practice.targetTokens.length) {
      sentenceComplete();
    }
  } else {
    chipEl.classList.add('wrong');
    practice.errors++;
    practice.combo = 0;
    $('psCombo').textContent = 0;
    setTimeout(() => chipEl.classList.remove('wrong'), 400);
  }
}

function cancelLastToken() {
  if (practice.matchedIndex === 0) return;
  practice.matchedIndex--;
  const removedToken = practice.targetTokens[practice.matchedIndex];
  
  const chips = document.querySelectorAll('.chip');
  for (let chip of chips) {
    const idx = parseInt(chip.dataset.idx);
    if (practice.shuffledIndices[idx] === practice.matchedIndex) {
      practice.usedIndices.delete(practice.shuffledIndices[idx]);
      chip.classList.remove('used');
      practice.chipFocus = Array.from(chips).indexOf(chip);
      break;
    }
  }
  
  if (practice.matchedIndex > 0) {
    const prevToken = practice.targetTokens[practice.matchedIndex - 1];
    practice.userInput = practice.current.en.slice(0, prevToken.end);
  } else {
    practice.userInput = '';
  }
  
  $('inputShow').textContent = practice.userInput;
  updateSentenceDisplay();
  refreshChipFocus();
}

function sentenceComplete() {
  state.totalAttempts++;
  state.totalCorrect++;
  practice.correctCount++;
  
  let scoreGain = 10;
  if (practice.errors === 0) {
    scoreGain += 10;
    practice.combo++;
    if (practice.combo > state.maxCombo) state.maxCombo = practice.combo;
    if (practice.combo >= 3) showPopup('comboPopup', practice.combo + ' 连击！🔥');
    if (practice.combo >= 5) showPopup('perfectPopup', 'PERFECT! ✨');
  }
  practice.score += scoreGain;
  state.totalScore += scoreGain;
  
  $('psScore').textContent = practice.score;
  $('psCombo').textContent = practice.combo;
  speak(practice.current.en);
  
  state.learned.add(practice.current.id);
  
  setTimeout(() => nextSentence(), 1500);
}

function nextSentence() {
  practice.index++;
  loadSentence();
}
function prevSentence() {
  if (practice.index > 0) {
    practice.index--;
    loadSentence();
  }
}
function showPopup(id, text) {
  const el = $(id); el.textContent = text;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
function showCompleteModal() {
  const acc = practice.list.length > 0 ? Math.round(practice.correctCount / (practice.correctCount + practice.errors) * 100) : 100;
  $('modalCorrect').textContent = practice.correctCount;
  $('modalAccuracy').textContent = acc + '%';
  $('modalCombo').textContent = state.maxCombo;
  $('completeModal').classList.add('show');
}
function closeModal() { $('completeModal').classList.remove('show'); }
function resetProgress() {
  if (confirm('确定重置所有进度吗？')) {
    state = { learned: new Set(), totalScore: 0, totalAttempts: 0, totalCorrect: 0, maxCombo: 0 };
    saveState(); updateHomeStats(); renderScenes();
  }
}

// ============================================================
//  键盘控制 (WASD/HJKL)
// ============================================================
function chipEls() { return Array.from(document.querySelectorAll('.chip')); }
function refreshChipFocus() {
  const els = chipEls();
  if (!els.length) { practice.chipFocus = -1; return; }
  if (practice.chipFocus >= els.length) practice.chipFocus = els.length - 1;
  els.forEach((el, i) => el.classList.toggle('focused', i === practice.chipFocus));
}
function moveChipFocus(step) {
  const els = chipEls();
  if (!els.length) return;
  const idx = practice.chipFocus;
  if (idx < 0 || idx >= els.length) { practice.chipFocus = step > 0 ? 0 : els.length - 1; refreshChipFocus(); return; }
  for (let k = 1; k <= els.length; k++) {
    const j = ((idx + step * k) % els.length + els.length) % els.length;
    if (!els[j].classList.contains('used')) { practice.chipFocus = j; refreshChipFocus(); return; }
  }
}

// ★ 修复连续操作：选中后焦点自动跳到下一个未被使用的词
function selectFocusedChip() {
  const els = chipEls();
  const chip = els[practice.chipFocus];
  if (!chip || chip.classList.contains('used')) return;
  
  const keep = practice.chipFocus;
  clickChip(parseInt(chip.dataset.idx), chip.textContent, chip);
  
  // 顺延焦点
  const after = chipEls();
  if (!after.length) return;
  const n = after.length;
  for (let k = 1; k <= n; k++) {
    const j = ((keep + k) % n + n) % n;
    if (!after[j].classList.contains('used')) {
      practice.chipFocus = j;
      refreshChipFocus();
      return;
    }
  }
  practice.chipFocus = -1;
  refreshChipFocus();
}

document.addEventListener('keydown', e => {
  if (!$('practiceScreen').classList.contains('open')) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  
  const KEY_MAP = {
    'w': 'ArrowUp', 's': 'ArrowDown', 'a': 'ArrowLeft', 'd': 'ArrowRight',
    'h': 'ArrowLeft', 'j': 'ArrowDown', 'k': 'ArrowUp', 'l': 'ArrowRight',
    ' ': 'Enter'
  };
  const rawKey = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  const mappedKey = KEY_MAP[rawKey] || e.key;
  
  if ($('completeModal').classList.contains('show')) return;

  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;

  switch (mappedKey) {
    case "ArrowLeft": e.preventDefault(); moveChipFocus(-1); break;
    case "ArrowRight": e.preventDefault(); moveChipFocus(1); break;
    case "ArrowUp": e.preventDefault(); selectFocusedChip(); break;
    case "Enter": e.preventDefault(); selectFocusedChip(); break;
    case "ArrowDown": e.preventDefault(); cancelLastToken(); break;
  }
});

// 初始化
loadState();
updateHomeStats();
renderScenes();
</script>
